name: Deploy RAG System

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Run tests
        run: uv run pytest multiagent_rag_system/src/test/ -v --tb=short
        continue-on-error: false

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/rag-api:latest
            ${{ env.IMAGE_PREFIX }}/rag-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/rag-frontend:latest
            ${{ env.IMAGE_PREFIX }}/rag-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,infra/"
          target: /app/multiagent_rag_system

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /app/multiagent_rag_system

            # Write .env from GitHub secrets
            cat > .env << EOF
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            LANGSMITH_API_KEY=${{ secrets.LANGSMITH_API_KEY }}
            QDRANT_API_KEY=${{ secrets.QDRANT_API_KEY }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            GRAFANA_ADMIN_USER=${{ secrets.GRAFANA_ADMIN_USER }}
            GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            HF_TOKEN=${{ secrets.HF_TOKEN }}
            CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
            ENVIRONMENT=production
            LANGCHAIN_TRACING_V2=true
            LANGCHAIN_PROJECT=multiagent-rag
            EOF

            # Pull new images
            echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io \
              -u ${{ github.actor }} --password-stdin

            # Update image tags in docker-compose.yml to use the new SHA
            sed -i "s|image: ghcr.io/[^/]*/rag-api:.*|image: ${{ env.IMAGE_PREFIX }}/rag-api:${{ github.sha }}|" docker-compose.yml
            sed -i "s|image: ghcr.io/[^/]*/rag-frontend:.*|image: ${{ env.IMAGE_PREFIX }}/rag-frontend:${{ github.sha }}|" docker-compose.yml

            docker compose pull
            docker compose up -d --remove-orphans

            # Wait for services to be healthy
            echo "Waiting for API to be ready..."
            for i in {1..30}; do
              if curl -sf http://localhost/api/health > /dev/null 2>&1; then
                echo "API is ready"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "API failed to start"
                docker compose logs api
                exit 1
              fi
              sleep 2
            done

            docker compose ps