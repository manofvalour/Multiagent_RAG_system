#version: "3.9"

services:

  #Reverse Proxy & Load Balancer
  nginx:
    image: nginx:alpine
    container_name: rag_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - rag_network

  # ── FastAPI Backend
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rag_api
    # Port exposed for direct access during development only.
    # In production, all traffic routes through nginx — remove this port mapping.
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT:        ${ENVIRONMENT:-production}
      APP_VERSION:        ${APP_VERSION:-1.0.0}
      REDIS_URL:          redis://:${REDIS_PASSWORD}@redis:6379/0
      LLM_PROVIDER:       ${LLM_PROVIDER:-groq}
      GROQ_API_KEY:       ${GROQ_API_KEY}
      ANTHROPIC_API_KEY:  ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY:     ${OPENAI_API_KEY:-}
      QDRANT_ENDPOINT:    ${QDRANT_ENDPOINT:-http://qdrant:6333}
      QDRANT_API_KEY:     ${QDRANT_API_KEY}
      LOG_LEVEL:          ${LOG_LEVEL:-INFO}
      CORS_ORIGINS:       ${CORS_ORIGINS:-http://localhost}
      PROMETHEUS_ENABLED: "true"
      # OTel
      OTEL_ENABLED:                    ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME:               ${OTEL_SERVICE_NAME:-nexus-rag-api}
      OTEL_EXPORTER_OTLP_ENDPOINT:     ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      # LangSmith
      LANGCHAIN_TRACING_V2:  ${LANGCHAIN_TRACING_V2:-false}
      LANGSMITH_API_KEY:     ${LANGSMITH_API_KEY:-}
      LANGCHAIN_PROJECT:     ${LANGCHAIN_PROJECT:-nexus-rag}
    volumes:
      - rag_data:/app/data
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - rag_network

  # ── Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: rag_frontend
    # Port exposed for direct access during development only.
    # In production, traffic routes through nginx — remove this port mapping.
    ports:
      - "3000:80"   # host:container — nginx inside container listens on 80
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Frontend is nginx serving static files — healthcheck on port 80 not 3000
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - rag_network

  # ── Qdrant Vector Store
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant
    # Remove this port mapping in production — api connects via internal network
    ports:
      - "6333:6333"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6333/collections"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - rag_network

  # ── Redis Cache
  redis:
    image: redis:7-alpine
    container_name: rag_redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_MAX_MEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel warning
    volumes:
      - redis_data:/data
    # Remove this port mapping in production
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rag_network

  # ── Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: rag_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - rag_network

  # ── Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: rag_grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS:         "grafana-piechart-panel"
      GF_PATHS_PROVISIONING:      /etc/grafana/provisioning
      GF_USERS_ALLOW_SIGN_UP:     "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - rag_network

  # ── Jaeger (OTel trace backend) ───────────────────────────────────────────
  # Optional — only needed if OTEL_ENABLED=true.
  # Remove this service if using a cloud OTel backend (Honeycomb, Grafana Cloud).
  #jaeger:
   # image: jaegertracing/all-in-one:latest
    #container_name: rag_jaeger
 #   ports:
  #    - "16686:16686"   # Jaeger UI — open localhost:16686 to view traces
   #   - "4317:4317"     # OTLP gRPC endpoint — set OTEL_EXPORTER_OTLP_ENDPOINT to this
    #  - "4318:4318"     # OTLP HTTP endpoint
 #   environment:
  #    COLLECTOR_OTLP_ENABLED: "true"
   # restart: unless-stopped
 #   healthcheck:
  #    test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:16686"]
   #   interval: 30s
    #  timeout: 5s
  #    retries: 3
 #   networks:
  #    - rag_network

networks:
  rag_network:
    driver: bridge

volumes:
  rag_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  prom_data:
    driver: local
  grafana_data:
    driver: local
  nginx_logs:
    driver: local